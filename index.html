<div id="mascot-widget" style="position: fixed; right: 20px; bottom: 20px; width: 220px; height: 220px; z-index: 9999; pointer-events: none;"></div>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const container = document.getElementById('mascot-widget');

  const CONFIG = {
    modelUrl: './str_wiskus.glb',
    desiredHeight: 1.8,
    maxYawDeg: 35,
    maxPitchDeg: 22,
    smoothness: 0.08,
    invertYaw: false,   // false = patrzy w stronę kursora lewo/prawo
    invertPitch: false  // false = patrzy w stronę kursora góra/dół
  };

  const scene = new THREE.Scene();

  const getSize = () => ({
    width: container.clientWidth || 220,
    height: container.clientHeight || 220
  });

  const initialSize = getSize();
  const camera = new THREE.PerspectiveCamera(
    35,
    initialSize.width / initialSize.height,
    0.05,
    500
  );
  camera.position.set(0, 0.1, 4.2);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(initialSize.width, initialSize.height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 1.4));

  const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
  keyLight.position.set(2.5, 4, 4);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x9bb8ff, 0.8);
  fillLight.position.set(-3, 1, 2);
  scene.add(fillLight);

  // Kontener w czystym układzie Three.js (Y = lewo/prawo, X = góra/dół)
  const pivot = new THREE.Group();
  pivot.rotation.order = 'YXZ';
  scene.add(pivot);

  const maxYaw = THREE.MathUtils.degToRad(CONFIG.maxYawDeg);
  const maxPitch = THREE.MathUtils.degToRad(CONFIG.maxPitchDeg);

  const pointer = { x: 0, y: 0 };
  const current = { yaw: 0, pitch: 0 };

  const loader = new GLTFLoader();
  loader.load(
    CONFIG.modelUrl,
    (gltf) => {
      const model = gltf.scene;

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const referenceDim = size.y > 0.0001 ? size.y : Math.max(size.x, size.z, 1);
      model.scale.setScalar(CONFIG.desiredHeight / referenceDim);

      const scaledBox = new THREE.Box3().setFromObject(model);
      const scaledCenter = scaledBox.getCenter(new THREE.Vector3());
      model.position.sub(scaledCenter);

      pivot.add(model);
    },
    undefined,
    (err) => {
      console.error('Błąd ładowania pliku .glb:', err);
    }
  );

  window.addEventListener('pointermove', (e) => {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -((e.clientY / window.innerHeight) * 2 - 1);
  });

  window.addEventListener('resize', () => {
    const next = getSize();
    camera.aspect = next.width / next.height;
    camera.updateProjectionMatrix();
    renderer.setSize(next.width, next.height);
  });

  function animate() {
    requestAnimationFrame(animate);

    const yawSign = CONFIG.invertYaw ? -1 : 1;
    const pitchSign = CONFIG.invertPitch ? -1 : 1;

    // pointer.x > 0 (kursor w prawo) -> obrót Y na plus (twarz w prawo)
    // pointer.y > 0 (kursor w górę) -> obrót X na minus (twarz w górę)
    const targetYaw = THREE.MathUtils.clamp(
      pointer.x * maxYaw * yawSign,
      -maxYaw,
      maxYaw
    );
    const targetPitch = THREE.MathUtils.clamp(
      -pointer.y * maxPitch * pitchSign,
      -maxPitch,
      maxPitch
    );

    current.yaw = THREE.MathUtils.lerp(current.yaw, targetYaw, CONFIG.smoothness);
    current.pitch = THREE.MathUtils.lerp(current.pitch, targetPitch, CONFIG.smoothness);

    pivot.rotation.y = current.yaw;
    pivot.rotation.x = current.pitch;

    renderer.render(scene, camera);
  }

  animate();
</script>
